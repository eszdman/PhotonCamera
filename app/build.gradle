apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
//apply plugin: "io.github.wurensen.android-aspectjx"
Properties versionProps = new Properties()
def buildEsd4d = providers.gradleProperty("photonBuildEsd4d").getOrElse("true").toBoolean()
def esd4dTuning = file("src/main/cpp/esd4d/tuning")
def tuningTools = file("src/main/cpp/framework/tuning")
def esd4dJava = layout.buildDirectory.dir("generated/source/esd4d")
def esd4dSettings = esd4dJava.map { it.file("com/particlesdevs/photoncamera/settings/merge/ESD4D.java") }
def tuningClang = androidComponents.sdkComponents.ndkDirectory.map { directory ->
    fileTree(directory.dir("toolchains/llvm/prebuilt")) {
        include "*/bin/clang++", "*/bin/clang++.exe"
    }.singleFile
}
def generateEsd4dSettings = tasks.register("generateEsd4dSettings", Exec) {
    inputs.files(fileTree(esd4dTuning), fileTree("src/main/cpp/esd4d/nodes") { include "*.hpp" },
            file("src/main/cpp/framework/kompute/KomputeNode.hpp"), new File(tuningTools, "generate.py"),
            new File(tuningTools, "Annotations.hpp"), tuningClang)
    outputs.file(esd4dSettings)
    doFirst {
        commandLine "python3", new File(tuningTools, "generate.py"), new File(esd4dTuning, "Esd4dTunables.hpp"),
                esd4dSettings.get().asFile, "--java-template", new File(esd4dTuning, "ESD4D.java.in"),
                "--clang", tuningClang.get()
    }
}
def postPackage = "com/particlesdevs/photoncamera/processing/opengl/postpipeline"
def postJava = layout.buildDirectory.dir("generated/source/postNodes")
def generatePostSettings = fileTree("src/main/java/${postPackage}") { include "*.java.in" }.collect { template ->
    def node = template.name - ".java.in"
    def source = file("src/main/cpp/postpipeline/nodes/${node}.cpp")
    def destination = postJava.map { it.file("${postPackage}/${node}.java") }
    tasks.register("generate${node}Settings", Exec) {
        inputs.files(template, source,
                new File(tuningTools, "generate.py"), new File(tuningTools, "Annotations.hpp"), tuningClang)
        outputs.file(destination)
        doFirst {
            commandLine "python3", new File(tuningTools, "generate.py"), source, destination.get().asFile,
                    "--java-template", template, "--clang", tuningClang.get()
        }
    }
}
android {
    sourceSets.main.java.srcDir(esd4dJava)
    sourceSets.main.java.srcDir(postJava)
    // Package the GLSL shared with Vulkan at its original GLES asset paths.
    sourceSets.main.assets.srcDir("src/main/cpp/shaders/shared")

    signingConfigs {
        debug {
            storeFile file('../key/PcamLeak.jks')
            storePassword 'photoncamera'
            keyPassword 'photoncamera'
            keyAlias 'key0'
        }
    }
    def versionPropsFile = file('version.properties')
    def versionBuild

    buildFeatures {
        buildConfig true
        dataBinding true
        mlModelBinding true
    }

    if (versionPropsFile.canRead()) {
        versionProps.load(new FileInputStream(versionPropsFile))
        versionBuild = versionProps['VERSION_BUILD'].toInteger()
    } else {
        throw new FileNotFoundException("Could not read version.properties!")
    }

    ext.autoIncrementBuildNumber = {
        if (versionPropsFile.canRead()) {
            versionProps.load(new FileInputStream(versionPropsFile))
            versionBuild = versionProps['VERSION_BUILD'].toInteger() + 1
            versionProps['VERSION_BUILD'] = versionBuild.toString()
            versionProps.store(versionPropsFile.newWriter(), null)
        } else {
            throw new FileNotFoundException("Could not read version.properties!")
        }
    }

    defaultConfig {
        buildConfigField "boolean", "BUILD_ESD4D", buildEsd4d.toString()
        externalNativeBuild {
            cmake {
                arguments "-DPHOTON_BUILD_ESD4D=${buildEsd4d ? 'ON' : 'OFF'}"
            }
        }
        compileSdk 36
        applicationId 'com.particlesdevs.photoncamera'
        minSdkVersion 26
        targetSdkVersion 36
        versionCode versionBuild
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            //noinspection ChromeOsAbiSupport
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        versionName '0.97'
        versionProps['VERSION_NAME'] = versionName
        proguardFiles
    }

    gradle.taskGraph.whenReady { taskGraph ->
        if (taskGraph.hasTask(assembleDebug)) {
            autoIncrementBuildNumber()
        } else if (taskGraph.hasTask(assembleRelease)) {
            autoIncrementBuildNumber()
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable = false
            zipAlignEnabled = true
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            jniDebuggable = true
            zipAlignEnabled = false
        }
    }

    externalNativeBuild {
        cmake {
            version "3.22.1"
            path "src/main/cpp/CMakeLists.txt"
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        abortOnError false
    }
    namespace 'com.particlesdevs.photoncamera'
    applicationVariants.all {
        variant -> variant.outputs.all {
            outputFileName = "PhotonCamera-${versionName}${versionBuild}-${variant.name}.apk"
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}




dependencies {

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(path: ':circularbarlib')
    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.preference:preference-ktx:1.2.1'
    implementation 'org.jetbrains:annotations:26.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.github.bumptech.glide:glide:5.0.5'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.5'
    implementation group: 'commons-io', name: 'commons-io', version: '20030203.000550'
    implementation 'com.google.code.gson:gson:2.13.2'
    // Navigation Component
    implementation "androidx.navigation:navigation-fragment-ktx:2.9.7"
    implementation "androidx.navigation:navigation-ui-ktx:2.9.7"
    //Subsampling image view
    implementation 'com.davemorrissey.labs:subsampling-scale-image-view-androidx:3.10.0'
    // Gallery modernization: ViewPager2 for bounded tiling/HDR (thumbnails via Glide - single loader to keep baseline low on 4GB)
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    //Google Material
    implementation 'com.google.android.material:material:1.14.0'
    // M3E shape morphs and spring physics (declared explicitly; also provided by Material)
    implementation 'androidx.graphics:graphics-shapes:1.0.1'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.1.0'
    implementation "androidx.core:core-ktx:1.18.0"
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation "com.anggrayudi:storage:2.2.0"
    implementation 'me.zhanghai.android.libarchive:library:1.1.6'
    //implementation 'com.microsoft.onnxruntime:onnxruntime-android:latest.release'
    //Leak Canary
    //Use this lib to detect memory leaks when debugging
    //debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.6'
    //For Testing
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'org.testng:testng:7.12.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
repositories {
    mavenCentral()
}

preBuild.dependsOn(generateEsd4dSettings, generatePostSettings)
