name: Android Pull Request & Master CI

on:
  pull_request:
    branches:
      - 'master'
      - 'dev'
  push:
    branches:
      - 'master'
      - 'dev'
  workflow_dispatch:

jobs:
  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    env:
      # Mapped to env so step-level `if` can detect whether the secret exists.
      # Empty on fork PRs and in repos where the secret was never configured.
      SIGNING_KEY: ${{ secrets.SIGNING_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: bash ./gradlew assembleDebug --stacktrace

      - name: Build release APK
        run: bash ./gradlew assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotonCamera-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Release is signed with the committed debug keystore by Gradle itself,
      # so this is always available even without the signing secrets.
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotonCamera-release-unsigned
          path: app/build/outputs/apk/release/PhotonCamera-*-release.apk
          if-no-files-found: error

      # Everything below only runs when the SIGNING_KEY secret is available.
      # Without it the workflow still succeeds with the debug and unsigned
      # release artifacts uploaded above.
      - name: Select newest build-tools for apksigner
        if: env.SIGNING_KEY != ''
        run: echo "BUILD_TOOLS_VERSION=$(basename "$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/"* | sort -V | tail -1)")" >> "$GITHUB_ENV"

      - name: Sign Android release
        if: env.SIGNING_KEY != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload signed release APK
        if: env.SIGNING_KEY != ''
        uses: actions/upload-artifact@v4
        with:
          name: PhotonCamera-release-signed
          path: app/build/outputs/apk/release/*-signed.apk
          if-no-files-found: error
