gradle.beforeProject { p ->
    if (p.path == ':app') p.plugins.withId('com.android.application') {
        p.androidComponents.finalizeDsl { dsl ->
            dsl.buildTypes.getByName('debug').applicationIdSuffix = '.postoracle'
            dsl.defaultConfig.ndk.abiFilters.clear()
            dsl.defaultConfig.ndk.abiFilters.add('arm64-v8a')
        }
    }
}
